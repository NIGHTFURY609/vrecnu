[package]
name = "vrecnu-bubble-win32"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The floating webcam bubble: a raw Win32 layered window, with no shell dependency."

[dependencies]
vrecnu-types.workspace = true
vrecnu-shell-api.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# Only the Win32 surfaces this window actually touches. The `windows` crate is feature-gated
# per module, so an unused feature is compile time we do not spend.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Console",
] }

[dev-dependencies]
vrecnu-types.workspace = true
