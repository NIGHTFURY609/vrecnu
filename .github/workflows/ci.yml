name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: TypeScript workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # Builds both apps: the PWA, and the standalone publish page the Phase 2 desktop exe
      # embeds (ADR-002). A broken publish build breaks the desktop release, not just the web.
      - run: pnpm build

      # AGENTS.md §1 calls exceeding a budget "a blocking review finding, not a discussion",
      # and ADR-004 warns that budgets checked by hand will drift.
      - name: Check bundle budgets (AGENTS.md §1)
        run: pnpm --filter web budgets

  desktop:
    name: Rust desktop (Windows)
    # Windows-only, and it must be Windows: the desktop app targets
    # x86_64-pc-windows-msvc and needs the Windows SDK to link at all.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      # The desktop crates embed two Vite builds at compile time: the publish page
      # (vrecnu-publish-server, ADR-002) and the shell's UI (vrecnu-shell-tauri, whose
      # tauri::generate_context! fails outright if packages/desktop-ui/dist is missing).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build the embedded frontends
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @vrecnu/publish --filter @vrecnu/desktop-ui build

      - name: Install Rust
        # Pinned here rather than in rust-toolchain.toml, so a pinned patch release cannot
        # break offline/air-gapped local builds. Cargo's `rust-version` is the floor: a single
        # 1.90 for the whole workspace (Tauri 2.12 requires it).
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop

      - run: cargo fmt --all -- --check

      - run: cargo clippy --all-targets --all-features -- -D warnings

      - run: cargo test --workspace

      # ADR-006's escape hatch is only real while this passes. Do not delete it; see
      # read_this_idiot.md.
      - name: Shell boundary is intact (ADR-006)
        shell: pwsh
        run: ./scripts/check-shell-boundary.ps1
